{% extends 'base.html' %}

{% block header %}<h2>Recipe List</h2>{% endblock %}

{% block content %}
<ul>
    {% for recipe in recipe_list %}
    <li><a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}</a></li>
    {% endfor %}
</ul>
<a href="{% url 'ledger:recipe_create' %}">Add recipe</a>
{% endblock %}
