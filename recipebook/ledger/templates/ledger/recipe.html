{% extends 'base.html' %}

{% block header %}<h2>Recipe Book</h2>{% endblock %}

{% block content %}
<h3>{{ recipe.name }} by {{ recipe.author }}</h3>
<ul>
    {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient.name }} x {{ ingredient.quantity }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
